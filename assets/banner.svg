    <line x1="250" y1="132" x2="250" y2="136"/>
    <line x1="290" y1="132" x2="290" y2="138"/>
    <line x1="330" y1="132" x2="330" y2="136"/>
  </g>

  <text x="50" y="160" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="13">
    <tspan fill="#b5502f">python</tspan>
    <tspan fill="#a49c88"> / </tspan>
    <tspan fill="#3f6b52">osm</tspan>
    <tspan fill="#a49c88"> / </tspan>
    <tspan fill="#3a5f80">gis</tspan>
    <tspan fill="#a49c88"> / </tspan>
    <tspan fill="#6b5a94">cli</tspan>
  </text>

  <line x1="560" y1="172" x2="860" y2="172" stroke="#d8d1bb" stroke-width="1"/>

  <g stroke="#bdb6a1" stroke-width="1">
    <rect x="585" y="137" width="22" height="35" fill="#ddd7c8"/>
    <rect x="617" y="117" width="22" height="55" fill="#ddd7c8"/>
    <rect x="649" y="147" width="22" height="25" fill="#ddd7c8"/>
    <rect x="713" y="132" width="22" height="40" fill="#ddd7c8"/>
    <rect x="745" y="112" width="22" height="60" fill="#ddd7c8"/>
    <rect x="777" y="142" width="22" height="30" fill="#ddd7c8"/>
    <rect x="809" y="122" width="22" height="50" fill="#ddd7c8"/>
  </g>
  <rect x="681" y="102" width="22" height="70" fill="#c1502f" stroke="#8f3620" stroke-width="1"/>

  <line x1="692" y1="98" x2="692" y2="102" stroke="#c1502f" stroke-width="1"/>
