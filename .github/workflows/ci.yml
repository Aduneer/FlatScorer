name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --no-deps -e .

      - name: Import check
        run: python -c "import flatscorer"

      - name: Generate sample config
        run: python -m flatscorer --generate-config /tmp/config.json

      - name: Validate generated config is well-formed JSON
        run: python -c "import json; json.load(open('/tmp/config.json'))"

      # Routing needs osmnx's *optional* scipy/scikit-learn deps, so an import
      # check alone passes while a real run dies. Exercise the code path here,
      # on every Python version, using an in-memory graph and no network.
      - name: Route over a tiny in-memory graph
        run: |
          python - <<'PY'
          import networkx as nx
          from flatscorer.routing import route_time

          G = nx.MultiDiGraph(crs="EPSG:4326")
          G.add_node(1, x=13.0, y=52.0)
          G.add_node(2, x=13.01, y=52.0)
          G.add_edge(1, 2, length=1000.0)

          minutes, route = route_time(G, (52.0, 13.0), (52.0, 13.01))
          assert route == [(52.0, 13.0), (52.0, 13.01)], route
          print(f"routed OK: {minutes:.2f} min")
          PY

  # The matrix above installs the *newest* version inside every range, so the
  # declared floors in requirements.txt are never actually exercised. Install them
  # exactly, on the oldest supported Python, so a wrong floor fails here instead
  # of on a user's machine.
  min-versions:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install pinned minimum versions
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-min.txt
          pip install --no-deps -e .

      - name: Confirm the floors are what actually got installed
        run: pip freeze | grep -iE '^(osmnx|networkx|geopandas|pandas|folium|shapely|requests|platformdirs|scikit-learn|scipy)=='

      - name: Import check
        run: python -c "import flatscorer"

      - name: Generate sample config
        run: python -m flatscorer --generate-config /tmp/config.json

      - name: Route over a tiny in-memory graph
        run: |
          python - <<'PY'
          import networkx as nx
          from flatscorer.routing import route_time

          G = nx.MultiDiGraph(crs="EPSG:4326")
          G.add_node(1, x=13.0, y=52.0)
          G.add_node(2, x=13.01, y=52.0)
          G.add_edge(1, 2, length=1000.0)

          minutes, route = route_time(G, (52.0, 13.0), (52.0, 13.01))
          assert route == [(52.0, 13.0), (52.0, 13.01)], route
          print(f"routed OK: {minutes:.2f} min")
          PY

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # The suite is offline by design - no Overpass, no Nominatim.
      - name: Run tests
        run: pytest -q

  # Builds the wheel and installs it somewhere with no checkout on sys.path, so a
  # module missing from py-modules or a broken entry point fails here rather than
  # for whoever runs `pip install` first.
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Install the built wheel into a clean venv
        run: |
          python -m venv /tmp/pkgtest
          /tmp/pkgtest/bin/pip install dist/*.whl

      # Run from / so nothing resolves via the checkout by accident.
      - name: The console script works away from the source tree
        run: cd / && /tmp/pkgtest/bin/flatscorer --generate-config /tmp/packaged.json

      - name: The installed package carries every module it needs
        run: cd / && /tmp/pkgtest/bin/python -c "import flatscorer; from flatscorer import launcher; print(launcher.app_path())"

      # app.py is the one file located by *path* rather than imported, and the
      # banner is loaded at runtime - so both have to survive packaging, and
      # neither would be missed by an import check.
      - name: The GUI launcher and its assets ship with the package
        run: |
          cd / && /tmp/pkgtest/bin/python -c "
          import os
          from flatscorer import launcher, paths
          assert os.path.isfile(launcher.app_path()), launcher.app_path()
          banner = paths.resource_path('gui', 'assets', 'banner.svg')
          assert os.path.isfile(banner), banner
          print('gui/app.py and gui/assets shipped OK')
          "

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        run: ruff check . --output-format=github
