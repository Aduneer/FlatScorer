name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Import check
        run: python -c "import FlatScorer"

      - name: Generate sample config
        run: python FlatScorer.py --generate-config /tmp/config.json

      - name: Validate generated config is well-formed JSON
        run: python -c "import json; json.load(open('/tmp/config.json'))"

      # Routing needs osmnx's *optional* scipy/scikit-learn deps, so an import
      # check alone passes while a real run dies. Exercise the code path here,
      # on every Python version, using an in-memory graph and no network.
      - name: Route over a tiny in-memory graph
        run: |
          python - <<'PY'
          import networkx as nx
          import FlatScorer

          G = nx.MultiDiGraph(crs="EPSG:4326")
          G.add_node(1, x=13.0, y=52.0)
          G.add_node(2, x=13.01, y=52.0)
          G.add_edge(1, 2, length=1000.0)

          minutes, route = FlatScorer.walk_route(G, (52.0, 13.0), (52.0, 13.01))
          assert route == [(52.0, 13.0), (52.0, 13.01)], route
          print(f"routed OK: {minutes:.2f} min")
          PY

  # The matrix above installs the *newest* version inside every range, so the
  # declared floors in requirements.txt are never actually exercised. Install them
  # exactly, on the oldest supported Python, so a wrong floor fails here instead
  # of on a user's machine.
  min-versions:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install pinned minimum versions
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-min.txt

      - name: Confirm the floors are what actually got installed
        run: pip freeze | grep -iE '^(osmnx|networkx|geopandas|pandas|folium|shapely|requests|scikit-learn|scipy)=='

      - name: Import check
        run: python -c "import FlatScorer"

      - name: Generate sample config
        run: python FlatScorer.py --generate-config /tmp/config.json

      - name: Route over a tiny in-memory graph
        run: |
          python - <<'PY'
          import networkx as nx
          import FlatScorer

          G = nx.MultiDiGraph(crs="EPSG:4326")
          G.add_node(1, x=13.0, y=52.0)
          G.add_node(2, x=13.01, y=52.0)
          G.add_edge(1, 2, length=1000.0)

          minutes, route = FlatScorer.walk_route(G, (52.0, 13.0), (52.0, 13.01))
          assert route == [(52.0, 13.0), (52.0, 13.01)], route
          print(f"routed OK: {minutes:.2f} min")
          PY

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # The suite is offline by design - no Overpass, no Nominatim.
      - name: Run tests
        run: pytest -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        run: ruff check . --output-format=github
