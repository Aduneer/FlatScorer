<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" role="img">
  <title>FlatScorer</title>
  <desc>Banner for FlatScorer, a multi-criteria apartment scoring tool using OpenStreetMap data</desc>

  <rect width="900" height="200" rx="6" fill="#f6f1e4" stroke="#ddd2b4" stroke-width="1"/>

  <g fill="none" stroke="#2f5233" stroke-width="1">
    <ellipse cx="180" cy="60" rx="260" ry="70" opacity="0.09"/>
    <ellipse cx="220" cy="70" rx="190" ry="50" opacity="0.11"/>
    <ellipse cx="700" cy="150" rx="230" ry="65" opacity="0.08"/>
    <ellipse cx="640" cy="160" rx="150" ry="42" opacity="0.1"/>
  </g>

  <text x="50" y="92" font-family="'Fraunces','Georgia','Times New Roman',serif" font-weight="600" font-size="44" fill="#3a3226">FlatScorer</text>

  <text x="52" y="116" font-family="'Space Mono','Courier New',monospace" font-size="12.5" fill="#7a6f5c">multi-criteria apartment scoring &#183; openstreetmap data</text>

  <g stroke="#2f5233" opacity="0.5" stroke-width="1">
    <line x1="50" y1="132" x2="330" y2="132"/>
    <line x1="50" y1="132" x2="50" y2="138"/>
    <line x1="90" y1="132" x2="90" y2="136"/>
    <line x1="130" y1="132" x2="130" y2="138"/>
    <line x1="170" y1="132" x2="170" y2="136"/>
    <line x1="210" y1="132" x2="210" y2="138"/>
    <line x1="250" y1="132" x2="250" y2="136"/>
    <line x1="290" y1="132" x2="290" y2="138"/>
    <line x1="330" y1="132" x2="330" y2="136"/>
  </g>

  <text x="50" y="160" font-family="'Space Mono','Courier New',monospace" font-size="13">
    <tspan fill="#2f5233">python</tspan>
    <tspan fill="#c4b596"> &#183; </tspan>
    <tspan fill="#6b7a3f">osm</tspan>
    <tspan fill="#c4b596"> &#183; </tspan>
    <tspan fill="#b5651d">gis</tspan>
    <tspan fill="#c4b596"> &#183; </tspan>
    <tspan fill="#7a6f5c">cli</tspan>
  </text>

  <line x1="560" y1="30" x2="560" y2="172" stroke="#ddd2b4" stroke-width="1"/>
  <line x1="560" y1="172" x2="860" y2="172" stroke="#ddd2b4" stroke-width="1"/>

  <path d="M590,150 L630,125 L670,140 L712,95 L754,118 L796,100 L838,128" fill="none" stroke="#2f5233" stroke-width="1.5" stroke-dasharray="4 5" opacity="0.85"/>

  <g stroke="#2f5233" stroke-width="1.5" fill="#f6f1e4">
    <circle cx="590" cy="150" r="4"/>
    <circle cx="630" cy="125" r="4"/>
    <circle cx="670" cy="140" r="4"/>
    <circle cx="754" cy="118" r="4"/>
    <circle cx="796" cy="100" r="4"/>
    <circle cx="838" cy="128" r="4"/>
  </g>

  <g transform="rotate(-7 712 95)">
    <circle cx="712" cy="95" r="22" fill="#f6f1e4" stroke="#b5651d" stroke-width="2"/>
    <circle cx="712" cy="95" r="17" fill="none" stroke="#b5651d" stroke-width="1"/>
    <text x="712" y="92.5" font-family="'Space Mono','Courier New',monospace" font-weight="700" font-size="7.5" letter-spacing="0.5" fill="#b5651d" text-anchor="middle">TOP</text>
    <text x="712" y="101" font-family="'Space Mono','Courier New',monospace" font-weight="700" font-size="7.5" letter-spacing="0.5" fill="#b5651d" text-anchor="middle">PICK</text>
  </g>

  <g stroke="#2f5233" stroke-width="1" fill="none">
    <circle cx="858" cy="44" r="22"/>
    <circle cx="858" cy="44" r="13" stroke-width="0.75" opacity="0.6"/>
    <line x1="858" y1="22" x2="858" y2="14" stroke-width="1.5"/>
    <line x1="880" y1="44" x2="888" y2="44" stroke-width="1.5"/>
    <line x1="858" y1="66" x2="858" y2="74" stroke-width="1.5"/>
    <line x1="836" y1="44" x2="828" y2="44" stroke-width="1.5"/>
  </g>
  <path d="M858,28 L864,44 L852,44 Z" fill="#b5651d"/>
  <path d="M852,44 L864,44 L858,60 Z" fill="#2f5233"/>
